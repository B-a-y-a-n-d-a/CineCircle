<body class="bg-surface text-on-surface min-h-screen flex flex-col font-body-md overflow-hidden">
<!-- Atmospheric Background Layers -->
<div class="fixed inset-0 bg-surface-container-lowest z-0">
<!-- The Background Shader -->

<!-- Texture Overlay -->
<div class="absolute inset-0 bg-pattern opacity-100"></div>
<!-- Depth Vignette -->
<div class="absolute inset-0 bg-gradient-to-t from-surface via-transparent to-transparent"></div>
</div>
<!-- Main Content Canvas -->
<main class="relative z-10 flex-1 flex items-center justify-center px-container-margin">
<div class="max-w-md w-full animate-in fade-in zoom-in duration-500">
<!-- Modal Container -->
<div class="glass-morphism rounded-xl p-10 flex flex-col items-center text-center shadow-[0_20px_50px_rgba(0,0,0,0.5)]">
<!-- Branding Icon -->
<div class="mb-6 flex items-center justify-center w-16 h-16 rounded-full bg-primary-container/10 border border-primary-container/20">
<span class="material-symbols-outlined text-primary-container !text-4xl" data-icon="movie">movie</span>
</div>
<!-- Heading Group -->
<h1 class="font-headline-lg text-headline-lg text-on-surface mb-3 tracking-tight">
                    Welcome to CineCircle
                </h1>
<p class="font-body-md text-body-md text-tertiary-container mb-10 max-w-[280px]">
                    Please enter a display name to join the conversation.
                </p>
<!-- Form Section -->
<form class="w-full space-y-6" id="name-form">
<div class="group relative text-left">
<label class="block font-label-sm text-label-sm text-on-surface-variant mb-2 ml-1" for="display_name">
                            Display Name
                        </label>
<input class="w-full bg-surface-container-lowest border border-white/10 rounded-lg px-4 py-3.5 text-on-surface placeholder:text-surface-variant focus:outline-none focus:ring-1 focus:ring-primary-container focus:border-primary-container transition-all" id="display_name" placeholder="e.g. CinemaLover99" type="text"/>
<p class="mt-2 text-sm text-error hidden" id="name-error"></p>
</div>
<button class="glow-button w-full bg-primary-container text-on-primary-fixed font-title-md text-title-md py-4 rounded-lg flex items-center justify-center gap-2 transition-all active:scale-95" id="submit-btn" type="submit">
                        <span id="submit-label">Continue</span>
                        <span class="material-symbols-outlined !text-lg" data-icon="arrow_forward">arrow_forward</span>
</button>
</form>
<!-- Subtle Footer Branding -->
<div class="mt-8">
<span class="font-display-lg text-display-lg !text-xl font-extrabold text-primary tracking-tighter opacity-50">CineCircle</span>
</div>
</div>
<!-- Quick Help / Hint -->
<p class="mt-6 text-center font-label-sm text-label-sm text-surface-variant px-4">
                By continuing, you agree to our <a class="text-tertiary hover:text-primary transition-colors underline decoration-primary/30" href="#">Community Guidelines</a>.
            </p>
</div>
</main>
<!-- Footer Identity (Invisible on this specific transactional screen per mandate) -->
<!-- The prompt requires a name entry screen, often a task-focused sub-page, so global nav is suppressed. -->
<script src="js/app.js"></script>
<script>
        // Micro-interaction for input glow effect follow
        const inputField = document.getElementById('display_name');
        const container = inputField.closest('.glass-morphism');

        inputField.addEventListener('focus', () => {
            container.style.boxShadow = '0 0 40px rgba(226, 54, 54, 0.15)';
        });

        inputField.addEventListener('blur', () => {
            container.style.boxShadow = '0 20px 50px rgba(0, 0, 0, 0.5)';
        });

        // If we already know who this person is, skip straight to the app.
        if (CineCircle.getUser()) {
            window.location.href = 'watch_groups.html';
        }

        const form = document.getElementById('name-form');
        const errorEl = document.getElementById('name-error');
        const submitBtn = document.getElementById('submit-btn');
        const submitLabel = document.getElementById('submit-label');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = inputField.value.trim();
            errorEl.classList.add('hidden');
            if (!name) {
                errorEl.textContent = 'Please enter a display name.';
                errorEl.classList.remove('hidden');
                return;
            }
            submitBtn.disabled = true;
            submitLabel.textContent = 'Joining…';
            try {
                const user = await CineCircle.api('/users', { method: 'POST', body: { name } });
                CineCircle.setUser(user);
                window.location.href = 'watch_groups.html';
            } catch (err) {
                errorEl.textContent = err.message || 'Something went wrong. Try again.';
                errorEl.classList.remove('hidden');
                submitBtn.disabled = false;
                submitLabel.textContent = 'Continue';
            }
        });
    </script>
</body></html>
