<!DOCTYPE html>

<html class="dark" lang="en"><head>

<title>CineCircle | Create Group</title>

                    "on-tertiary-fixed-variant": "#454747",

                    "error": "#ffb4ab",

<body class="bg-surface text-on-surface selection:bg-primary-container selection:text-on-primary-container overflow-hidden">
<!-- Background Layer (Home Screen Mockup) -->
<main class="fixed inset-0 w-full h-full pattern-overlay flex flex-col pointer-events-none">
<!-- TopNavBar (Simulated) -->
<header class="bg-surface/60 backdrop-blur-md border-b border-white/10 shadow-[0_0_20px_rgba(226,54,54,0.1)] flex justify-between items-center w-full px-container-margin py-4 max-w-7xl mx-auto">
<h1 class="font-display-lg text-display-lg font-extrabold text-primary tracking-tighter">CineCircle</h1>
<div class="hidden md:flex gap-8">
<span class="text-on-surface-variant font-medium">Watch Groups</span>
<span class="text-on-surface-variant font-medium">My Plans</span>
<span class="text-on-surface-variant font-medium">Discussion Board</span>
</div>
<div class="w-10 h-10 rounded-full bg-surface-container-high border border-white/10"></div>
</header>
<!-- Mock Content -->
<div class="flex-1 p-10 max-w-7xl mx-auto w-full">
<div class="grid grid-cols-12 gap-card-gap">
<div class="col-span-8 h-80 rounded-xl bg-surface-container-low border border-white/5 p-8">
<div class="w-2/3 h-10 bg-surface-variant/30 rounded mb-4"></div>
<div class="w-full h-40 bg-surface-variant/20 rounded"></div>
</div>
<div class="col-span-4 h-80 rounded-xl bg-surface-container-low border border-white/5"></div>
</div>
</div>
</main>
<!-- Modal Overlay Backdrop -->
<div class="fixed inset-0 bg-surface-container-lowest/80 backdrop-blur-xl z-40 transition-opacity duration-500"></div>
<!-- Create Group Modal Container -->
<div class="fixed inset-0 z-50 flex items-center justify-center p-container-margin pointer-events-none">
<div class="pointer-events-auto glass-panel ambient-glow w-full max-w-2xl rounded-xl overflow-hidden flex flex-col">
<!-- Modal Header -->
<div class="px-8 py-6 border-b border-white/5 flex justify-between items-center bg-surface-container-low">
<div>
<h2 class="font-headline-lg text-headline-lg text-on-surface tracking-tight">Request a Watch Group</h2>
<p class="font-label-sm text-label-sm text-on-surface-variant">An admin reviews every request before it goes live for other cinephiles to join.</p>
</div>
<button class="p-2 hover:bg-surface-variant/50 rounded-full transition-colors text-on-surface-variant" id="close-btn" type="button">
<span class="material-symbols-outlined">close</span>
</button>
</div>
<!-- Form Content -->
<form class="p-8 space-y-6 overflow-y-auto max-h-[70vh]" id="create-form">
<p class="text-error text-sm hidden" id="form-error"></p>
<div class="grid grid-cols-1 md:grid-cols-2 gap-6">
<!-- Group Name -->
<div class="md:col-span-2">
<label class="block font-label-sm text-label-sm text-on-surface mb-2" for="group-name">Group Name</label>
<input class="w-full bg-surface-container-lowest border border-white/10 rounded-lg px-4 py-3 text-on-surface focus:ring-1 focus:ring-primary-container focus:border-primary-container outline-none transition-all placeholder:text-on-surface-variant/40 font-body-md text-body-md" id="group-name" placeholder="e.g. Web-Heads of Joburg" type="text"/>
</div>
<!-- Movie Dropdown -->
<div class="md:col-span-2">
<label class="block font-label-sm text-label-sm text-on-surface mb-2" for="movie">Movie</label>
<div class="relative">
<select class="appearance-none w-full bg-surface-container-lowest border border-white/10 rounded-lg px-4 py-3 text-on-surface focus:ring-1 focus:ring-primary-container focus:border-primary-container outline-none transition-all font-body-md text-body-md" id="movie">
<option value="">Loading movies…</option>
</select>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 pointer-events-none text-on-surface-variant">expand_more</span>
</div>
</div>
<!-- Screening Dropdown -->
<div class="md:col-span-2">
<label class="block font-label-sm text-label-sm text-on-surface mb-2" for="screening">Screening</label>
<div class="relative">
<select class="appearance-none w-full bg-surface-container-lowest border border-white/10 rounded-lg px-4 py-3 text-on-surface focus:ring-1 focus:ring-primary-container focus:border-primary-container outline-none transition-all font-body-md text-body-md" id="screening">
<option value="">Choose a movie first</option>
</select>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 pointer-events-none text-on-surface-variant">expand_more</span>
</div>
</div>
<!-- Vibe Dropdown -->
<div>
<label class="block font-label-sm text-label-sm text-on-surface mb-2" for="vibe">Vibe</label>
<div class="relative">
<select class="appearance-none w-full bg-surface-container-lowest border border-white/10 rounded-lg px-4 py-3 text-on-surface focus:ring-1 focus:ring-primary-container focus:border-primary-container outline-none transition-all font-body-md text-body-md" id="vibe">
<option>Casual</option>
<option>Hardcore fans</option>
<option>First-timers welcome</option>
<option>Quiet watchers</option>
</select>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 pointer-events-none text-on-surface-variant">palette</span>
</div>
</div>
<!-- Max Group Size -->
<div>
<label class="block font-label-sm text-label-sm text-on-surface mb-2" for="size">Max Group Size</label>
<input class="w-full bg-surface-container-lowest border border-white/10 rounded-lg px-4 py-3 text-on-surface focus:ring-1 focus:ring-primary-container focus:border-primary-container outline-none transition-all font-body-md text-body-md" id="size" max="20" min="2" type="number" value="8"/>
</div>
<!-- After-Movie Hangout -->
<div class="md:col-span-2">
<label class="block font-label-sm text-label-sm text-on-surface mb-2" for="hangout">After-Movie Hangout Spot</label>
<input class="w-full bg-surface-container-lowest border border-white/10 rounded-lg px-4 py-3 text-on-surface focus:ring-1 focus:ring-primary-container focus:border-primary-container outline-none transition-all placeholder:text-on-surface-variant/40 font-body-md text-body-md" id="hangout" placeholder="e.g. Starbucks or The Corner Bistro" type="text"/>
</div>
<!-- Discussion Topic -->
<div class="md:col-span-2">
<label class="block font-label-sm text-label-sm text-on-surface mb-2" for="topic">Discussion Topic / Icebreaker</label>
<textarea class="w-full bg-surface-container-lowest border border-white/10 rounded-lg px-4 py-3 text-on-surface focus:ring-1 focus:ring-primary-container focus:border-primary-container outline-none transition-all placeholder:text-on-surface-variant/40 font-body-md text-body-md resize-none" id="topic" placeholder="What's one question you want answered in the sequel?" rows="3"></textarea>
</div>
</div>
</form>
<!-- Modal Footer -->
<div class="px-8 py-6 bg-surface-container/50 border-t border-white/5 flex flex-col-reverse md:flex-row justify-end items-center gap-4">
<button class="w-full md:w-auto px-8 py-3 rounded-lg border border-white/20 text-on-surface font-semibold hover:bg-white/5 transition-all active:scale-95 font-body-md text-body-md" id="cancel-btn" type="button">
                    Cancel
                </button>
<button class="w-full md:w-auto px-10 py-3 rounded-lg bg-primary-container text-white font-bold hover:brightness-110 shadow-[0_0_20px_rgba(255,84,78,0.3)] transition-all active:scale-95 font-body-md text-body-md" id="submit-btn" type="submit" form="create-form">
                    Submit Request
                </button>
</div>
</div>
</div>
<!-- Background Atmospheric Lighting Elements -->
<div class="fixed top-0 right-0 w-[500px] h-[500px] bg-primary/5 rounded-full blur-[120px] pointer-events-none -z-10"></div>
<div class="fixed bottom-0 left-0 w-[500px] h-[500px] bg-secondary-container/5 rounded-full blur-[120px] pointer-events-none -z-10"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabase-config.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/app.js"></script>
<script>
        // Micro-interaction for form inputs
        const inputs = document.querySelectorAll('input, select, textarea');
        inputs.forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.closest('div').style.transform = 'translateY(-2px)';
                input.parentElement.closest('div').style.transition = 'transform 0.3s ease';
            });
            input.addEventListener('blur', () => {
                input.parentElement.closest('div').style.transform = 'translateY(0)';
            });
        });

        let user;
        document.getElementById('cancel-btn').addEventListener('click', () => window.location.href = 'watch_groups.html');
        document.getElementById('close-btn').addEventListener('click', () => window.location.href = 'watch_groups.html');

        let allScreenings = [];

        async function loadScreeningsFor(movieId) {
            const select = document.getElementById('screening');
            const matches = allScreenings.filter(s => String(s.movie_id) === String(movieId));
            if (!movieId || matches.length === 0) {
                select.innerHTML = '<option value="">No screenings for this movie yet</option>';
                return;
            }
            select.innerHTML = matches.map(s =>
                `<option value="${s.id}">${CineCircle.escapeHtml(s.cinema)} — ${CineCircle.escapeHtml(s.show_time)} — ${CineCircle.escapeHtml(s.format)}</option>`
            ).join('');
        }

        async function loadMoviesAndScreenings() {
            const [movies, screenings] = await Promise.all([
                CineCircle.api('/movies'),
                CineCircle.api('/screenings'),
            ]);
            allScreenings = screenings;
            const movieSelect = document.getElementById('movie');
            movieSelect.innerHTML = movies.map(m => `<option value="${m.id}">${CineCircle.escapeHtml(m.title)}</option>`).join('');
            if (movies.length) await loadScreeningsFor(movies[0].id);
        }

        document.getElementById('movie').addEventListener('change', (e) => loadScreeningsFor(e.target.value));

        document.getElementById('create-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const errorEl = document.getElementById('form-error');
            const submitBtn = document.getElementById('submit-btn');
            errorEl.classList.add('hidden');

            const name = document.getElementById('group-name').value.trim();
            const screeningId = document.getElementById('screening').value;
            if (!name) {
                errorEl.textContent = 'Please give your group a name.';
                errorEl.classList.remove('hidden');
                return;
            }
            if (!screeningId) {
                errorEl.textContent = 'Pick a movie with an available screening.';
                errorEl.classList.remove('hidden');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = 'Submitting…';
            try {
                await CineCircle.api('/groups', {
                    method: 'POST',
                    body: {
                        name,
                        screening_id: Number(screeningId),
                        vibe: document.getElementById('vibe').value,
                        max_size: Number(document.getElementById('size').value) || 6,
                        spot: document.getElementById('hangout').value.trim(),
                        topic: document.getElementById('topic').value.trim(),
                        user_id: user.id,
                    },
                });
                window.location.href = 'my_plans.html?requested=1';
            } catch (err) {
                errorEl.textContent = err.message || 'Something went wrong. Try again.';
                errorEl.classList.remove('hidden');
                submitBtn.disabled = false;
                submitBtn.textContent = 'Submit Request';
            }
        });

        (async () => {
            const session = await CineCircle.requireSession();
            if (!session) return;
            user = CineCircle.requireUser();
            if (!user) return;
            CineCircle.wireUserChip();
            try {
                await loadMoviesAndScreenings();
            } catch (err) {
                document.getElementById('screening').innerHTML = `<option value="">Couldn't load screenings</option>`;
            }
        })();
    </script>
</body></html>
