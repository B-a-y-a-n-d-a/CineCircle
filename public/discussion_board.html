<script>
        document.getElementById('mobile-menu-btn')?.addEventListener('click', () => {
            document.getElementById('mobile-menu').classList.toggle('hidden');
        });

        let user;

        function revealSpoiler(container) {
            const overlay = container.querySelector('.spoiler-overlay');
            const content = container.querySelector('.spoiler-content');
            overlay.classList.add('opacity-0');
            content.classList.remove('spoiler-blur');
            content.classList.add('spoiler-unblurred');
            setTimeout(() => { overlay.style.display = 'none'; }, 300);
        }

        async function likePost(id, btn) {
            try {
                const { likes } = await CineCircle.api(`/posts/${id}/like`, { method: 'POST' });
                btn.querySelector('span:last-child').textContent = likes;
                btn.classList.add('text-primary');
                btn.style.transform = 'scale(1.2)';
                setTimeout(() => btn.style.transform = '', 200);
            } catch (err) {
                alert(err.message);
            }
        }

        function postCard(p) {
            const body = p.spoiler
                ? `<div class="relative group cursor-pointer mt-2 mb-4" onclick="revealSpoiler(this)">
                     <div class="spoiler-overlay absolute inset-0 z-10 flex flex-col items-center justify-center bg-surface-container/60 backdrop-blur-md rounded-lg transition-opacity duration-300">
                       <span class="material-symbols-outlined text-primary mb-1">warning</span>
                       <span class="text-primary font-bold text-sm tracking-wide">⚠️ SPOILER — tap to reveal</span>
                     </div>
                     <p class="spoiler-content spoiler-blur text-on-surface font-body-md text-body-md leading-relaxed p-4 bg-surface-container/30 rounded-lg">${CineCircle.escapeHtml(p.text)}</p>
                   </div>`
                : `<p class="text-on-surface font-body-md text-body-md leading-relaxed mb-4">${CineCircle.escapeHtml(p.text)}</p>`;

            return `<article class="glass-panel rounded-xl p-6 transition-transform hover:scale-[1.01] duration-300">
                <div class="flex gap-4">
                    <div class="w-12 h-12 rounded-full overflow-hidden border-2 border-primary-container/20 bg-surface-container-high text-primary flex items-center justify-center font-bold flex-shrink-0">${CineCircle.initials(p.author?.name)}</div>
                    <div class="flex-grow">
                        <div class="flex items-center justify-between mb-1">
                            <span class="font-title-md text-title-md text-on-surface">${CineCircle.escapeHtml(p.author?.name || 'Unknown')}</span>
                            <span class="text-tertiary-container font-label-sm text-label-sm">${CineCircle.timeAgo(p.created_at)}</span>
                        </div>
                        <span class="inline-block mb-2 text-[11px] font-bold uppercase tracking-wider text-secondary bg-secondary-container/20 px-2 py-0.5 rounded-full">${CineCircle.escapeHtml(p.movie?.title || '')}</span>
                        ${body}
                        <div class="flex items-center gap-6">
                            <button class="spider-btn flex items-center gap-2 text-on-surface-variant hover:text-primary transition-colors group" onclick="likePost('${p.id}', this)">
                                <span class="material-symbols-outlined text-[20px] group-hover:scale-110 transition-transform">bug_report</span>
                                <span class="font-label-sm text-label-sm">${p.likes}</span>
                            </button>
                        </div>
                    </div>
                </div>
            </article>`;
        }

        async function loadFeed() {
            const movieId = document.getElementById('feed-movie-filter').value;
            const posts = await CineCircle.api(movieId ? `/posts?movie_id=${movieId}` : '/posts');
            const feed = document.getElementById('feed');
            feed.innerHTML = posts.length
                ? posts.map(postCard).join('')
                : '<p class="text-on-surface-variant text-center py-10">No posts yet — be the first to share your take!</p>';
        }

        async function loadMoviesForBoard() {
            const movies = await CineCircle.api('/movies');
            const filterSelect = document.getElementById('feed-movie-filter');
            const postSelect = document.getElementById('post-movie');
            filterSelect.innerHTML = '<option value="">All movies</option>' +
                movies.map(m => `<option value="${m.id}">${CineCircle.escapeHtml(m.title)}</option>`).join('');
            postSelect.innerHTML = movies.map(m => `<option value="${m.id}">${CineCircle.escapeHtml(m.title)}</option>`).join('');
        }

        document.getElementById('feed-movie-filter').addEventListener('change', loadFeed);

        document.getElementById('post-submit').addEventListener('click', async () => {
            const textEl = document.getElementById('post-text');
            const errorEl = document.getElementById('post-error');
            const text = textEl.value.trim();
            const movieId = document.getElementById('post-movie').value;
            errorEl.classList.add('hidden');
            if (!text) {
                errorEl.textContent = 'Write something first.';
                errorEl.classList.remove('hidden');
                return;
            }
            if (!movieId) {
                errorEl.textContent = 'Pick which movie this is about.';
                errorEl.classList.remove('hidden');
                return;
            }
            try {
                await CineCircle.api('/posts', {
                    method: 'POST',
                    body: { user_id: user.id, text, spoiler: document.getElementById('post-spoiler').checked, movie_id: Number(movieId) },
                });
                textEl.value = '';
                document.getElementById('post-spoiler').checked = false;
                await loadFeed();
            } catch (err) {
                errorEl.textContent = err.message || 'Something went wrong.';
                errorEl.classList.remove('hidden');
            }
        });

        (async () => {
            const session = await CineCircle.requireSession();
            if (!session) return;
            user = CineCircle.requireUser();
            if (!user) return;
            document.getElementById('composer-avatar').textContent = CineCircle.initials(user?.name);
            CineCircle.wireUserChip();
            try {
                await loadMoviesForBoard();
                await loadFeed();
            } catch (err) {
                document.getElementById('feed').innerHTML =
                    `<p class="text-error text-center py-10">Couldn't load the discussion: ${CineCircle.escapeHtml(err.message)}</p>`;
            }
        })();
    </script>
