<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CineCircle</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabase-config.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/app.js"></script>
<script>
  // Route to the right screen: no session -> login, session but no display
  // name saved yet -> welcome, otherwise straight into the app.
  (async () => {
    const session = await CineCircleAuth.getSession();
    if (!session) {
      window.location.href = 'login.html';
    } else if (!CineCircle.getUser()) {
      window.location.href = 'welcome.html';
    } else {
      window.location.href = 'watch_groups.html';
    }
  })();
</script>
</head>
<body></body>
</html>
